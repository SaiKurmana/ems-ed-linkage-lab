[project]
name = "ems-ed-linkage-lab"
version = "0.1.0"
description = "Simulating EMS-to-ED record linkage with a shared UUID (synthetic data only)."
requires-python = ">=3.11,<3.12"
authors = [{ name = "Sai Kurmana" }]
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "_site", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
